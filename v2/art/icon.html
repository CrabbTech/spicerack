<!doctype html>
<html>
<head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent;width:1024px;height:1024px;overflow:hidden}</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="0.55" stop-color="#1a0a3c"/>
      <stop offset="1" stop-color="#0e0426"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/>
      <stop offset="0.55" stop-color="#ff5e9d"/>
      <stop offset="1" stop-color="#ff2975"/>
    </linearGradient>
    <linearGradient id="crabGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8ade"/>
      <stop offset="1" stop-color="#ff5e86"/>
    </linearGradient>
    <clipPath id="bgClip"><rect x="32" y="32" width="960" height="960" rx="224"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- horizontal slices out of the sun -->
    <mask id="sunMask">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <rect x="120" y="430" width="784" height="14" fill="#000"/>
      <rect x="120" y="474" width="784" height="20" fill="#000"/>
      <rect x="120" y="524" width="784" height="26" fill="#000"/>
    </mask>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGrad)"/>

  <g clip-path="url(#bgClip)">
    <!-- vapor sun -->
    <circle cx="512" cy="400" r="292" fill="url(#sunGrad)" mask="url(#sunMask)" opacity="0.96"/>
    <circle cx="512" cy="400" r="292" fill="url(#sunGrad)" mask="url(#sunMask)" filter="url(#glow)" opacity="0.35"/>

    <!-- perspective grid -->
    <g stroke="#01cdfe" stroke-width="4" opacity="0.6">
      <line x1="512" y1="580" x2="512" y2="992"/>
      <line x1="512" y1="580" x2="312" y2="992"/>
      <line x1="512" y1="580" x2="112" y2="992"/>
      <line x1="512" y1="580" x2="-128" y2="992"/>
      <line x1="512" y1="580" x2="712" y2="992"/>
      <line x1="512" y1="580" x2="912" y2="992"/>
      <line x1="512" y1="580" x2="1152" y2="992"/>
      <line x1="32" y1="580" x2="992" y2="580" stroke-width="5"/>
      <line x1="32" y1="608" x2="992" y2="608"/>
      <line x1="32" y1="646" x2="992" y2="646"/>
      <line x1="32" y1="700" x2="992" y2="700"/>
      <line x1="32" y1="772" x2="992" y2="772"/>
      <line x1="32" y1="866" x2="992" y2="866"/>
      <line x1="32" y1="972" x2="992" y2="972"/>
    </g>
    <!-- dark fade under crab for contrast -->
    <ellipse cx="512" cy="760" rx="430" ry="260" fill="#0e0426" opacity="0.55"/>

    <!-- ====== CRAB ====== -->
    <!-- cyan rim glow behind -->
    <g filter="url(#glow)" opacity="0.9">
      <g fill="none" stroke="#01edfe" stroke-width="22" stroke-linecap="round">
        <ellipse cx="512" cy="700" rx="205" ry="148"/>
        <path d="M 295 470 A 97 97 0 1 0 343 555 L 262 525 Z"/>
        <path d="M 729 470 A 97 97 0 1 1 681 555 L 762 525 Z"/>
      </g>
    </g>

    <g stroke-linecap="round">
      <!-- legs -->
      <g stroke="url(#crabGrad)" stroke-width="30" fill="none">
        <line x1="338" y1="742" x2="240" y2="806"/>
        <line x1="356" y1="784" x2="266" y2="858"/>
        <line x1="386" y1="818" x2="308" y2="892"/>
        <line x1="686" y1="742" x2="784" y2="806"/>
        <line x1="668" y1="784" x2="758" y2="858"/>
        <line x1="638" y1="818" x2="716" y2="892"/>
      </g>
      <!-- arms -->
      <g stroke="url(#crabGrad)" stroke-width="42" fill="none">
        <path d="M 366 640 Q 308 612 285 568"/>
        <path d="M 658 640 Q 716 612 739 568"/>
      </g>
      <!-- claws: pac-man wedges opening up-inward -->
      <path d="M 295 470 A 97 97 0 1 0 343 555 L 262 525 Z" fill="url(#crabGrad)" stroke="#01edfe" stroke-width="9"/>
      <path d="M 729 470 A 97 97 0 1 1 681 555 L 762 525 Z" fill="url(#crabGrad)" stroke="#01edfe" stroke-width="9"/>
      <!-- eye stalks -->
      <g stroke="url(#crabGrad)" stroke-width="24" fill="none">
        <line x1="452" y1="580" x2="441" y2="512"/>
        <line x1="572" y1="580" x2="583" y2="512"/>
      </g>
      <!-- body -->
      <ellipse cx="512" cy="700" rx="205" ry="148" fill="url(#crabGrad)" stroke="#01edfe" stroke-width="9"/>
      <!-- eyes -->
      <circle cx="441" cy="496" r="42" fill="#fff" stroke="#01edfe" stroke-width="7"/>
      <circle cx="583" cy="496" r="42" fill="#fff" stroke="#01edfe" stroke-width="7"/>
      <circle cx="447" cy="503" r="19" fill="#1a0a3c"/>
      <circle cx="577" cy="503" r="19" fill="#1a0a3c"/>
      <circle cx="441" cy="489" r="7" fill="#fff"/>
      <circle cx="575" cy="489" r="7" fill="#fff"/>
      <!-- zigzag mouth -->
      <path d="M 472 728 L 492 746 L 512 728 L 532 746 L 552 728" fill="none" stroke="#2b0a3d" stroke-width="11"/>
      <!-- shell shine -->
      <path d="M 392 640 Q 512 588 632 640" fill="none" stroke="#ffc4ec" stroke-width="13" opacity="0.85"/>
    </g>

    <!-- sparkles -->
    <g fill="#9ffcff" filter="url(#softGlow)">
      <path d="M 806 318 l 8 26 26 8 -26 8 -8 26 -8 -26 -26 -8 26 -8 Z"/>
      <path d="M 206 246 l 6 19 19 6 -19 6 -6 19 -6 -19 -19 -6 19 -6 Z"/>
    </g>
    <g fill="#e6ffff">
      <path d="M 806 318 l 8 26 26 8 -26 8 -8 26 -8 -26 -26 -8 26 -8 Z"/>
      <path d="M 206 246 l 6 19 19 6 -19 6 -6 19 -6 -19 -19 -6 19 -6 Z"/>
    </g>
  </g>
</svg>
</body>
</html>
